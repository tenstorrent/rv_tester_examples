image:
    name: "ghcr.io/tenstorrent/cvm:0.1.3"

include:
  - project: 'riscv/dv/gitlab-definitions'
    ref: main
    file: 'common-definitions.yml'

stages:
    - test

# One Bazel module for the whole repo; jobs run at the repo root and call the
# shared common/infra/bazel.sh. The image above already provides bazel-7, so no
# container wrapper is needed here.
.test-template:
    variables:
        SCHEDULER_PARAMETERS: "-n 8 -R span[hosts=1]"
        BAZEL_OPTS: "--jobs=8"

build:
    stage: test
    extends:
        - .test-template
    script:
        - common/infra/bazel.sh --run-path=./bazel_output_user_root build //cva6/dv/verilator:cva6_tb_verilator --config=bzlmod ${BAZEL_OPTS}
    after_script:
        - chmod +w -R ./bazel_output_user_root
    timeout: 3h

smoke:
    stage: test
    extends:
        - .test-template
    script:
        - common/infra/bazel.sh --run-path=./bazel_output_user_root test //cva6/dv/testlists:all_smoke --config=bzlmod --build_tests_only --test_output=errors ${BAZEL_OPTS}
    after_script:
        - chmod +w -R ./bazel_output_user_root
    timeout: 3h

build_openc910:
    stage: test
    extends:
        - .test-template
    script:
        - common/infra/bazel.sh --run-path=./bazel_output_user_root build //openc910/dv/verilator:openc910_tb_verilator --config=bzlmod ${BAZEL_OPTS}
    after_script:
        - chmod +w -R ./bazel_output_user_root
    timeout: 3h

smoke_openc910:
    stage: test
    extends:
        - .test-template
    script:
        - common/infra/bazel.sh --run-path=./bazel_output_user_root test //openc910/dv/testlists:all_smoke --config=bzlmod --build_tests_only --test_output=errors ${BAZEL_OPTS}
    after_script:
        - chmod +w -R ./bazel_output_user_root
    timeout: 3h
