# GitHub Actions CI for the cva6 and openc910 examples.
#
# Builds the Verilator model and runs the lockstep smoke suite for both cores
# inside the public cvm image (bazel-7 + toolchain). Dependencies (rv_tester,
# cvm, CoreArchChecker, mem_manager) are pulled from their public github.com
# mirrors, so this runs on standard GitHub-hosted runners. Triggers on every
# push and pull request (any branch).
name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.3
    defaults:
      run:
        working-directory: cva6
    steps:
      - uses: actions/checkout@v4
      - name: Build Verilator model
        run: |
          bazel-7 --output_user_root=./bazel_output_user_root \
            build //dv/cva6/verilator:cva6_tb_verilator \
            --config=bzlmod --jobs=8
      - name: Clean output root
        if: always()
        run: chmod +w -R ./bazel_output_user_root || true

  smoke:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.3
    defaults:
      run:
        working-directory: cva6
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke (lockstep vs Whisper)
        run: |
          bazel-7 --output_user_root=./bazel_output_user_root \
            test //dv/cva6/testlists:all_smoke \
            --config=bzlmod --build_tests_only --test_output=errors --jobs=8
      - name: Clean output root
        if: always()
        run: chmod +w -R ./bazel_output_user_root || true

  build_openc910:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.3
    defaults:
      run:
        working-directory: openc910
    steps:
      - uses: actions/checkout@v4
      - name: Build Verilator model
        run: |
          bazel-7 --output_user_root=./bazel_output_user_root \
            build //dv/openc910/verilator:openc910_tb_verilator \
            --config=bzlmod --jobs=8
      - name: Clean output root
        if: always()
        run: chmod +w -R ./bazel_output_user_root || true

  smoke_openc910:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tenstorrent/cvm:0.1.3
    defaults:
      run:
        working-directory: openc910
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke (lockstep vs Whisper)
        run: |
          bazel-7 --output_user_root=./bazel_output_user_root \
            test //dv/openc910/testlists:all_smoke \
            --config=bzlmod --build_tests_only --test_output=errors --jobs=8
      - name: Clean output root
        if: always()
        run: chmod +w -R ./bazel_output_user_root || true
